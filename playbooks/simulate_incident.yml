---
# Play 1: Plant issues on target host for 'unknown' incident type
- name: Simulate - Plant Issues on Host (unknown only)
  hosts: "{{ target_host | default('cert-demo-vm') }}"
  gather_facts: false
  become: true
  vars:
    incident_types_list: "{{ incident_types if incident_types is iterable and incident_types is not string else [incident_types] }}"

  tasks:
    - name: Check incident types selected
      ansible.builtin.set_fact:
        simulate_unknown: "{{ 'unclassified' in incident_types_list }}"
        simulate_service_down: "{{ 'service_down' in incident_types_list }}"
        simulate_config_drift: "{{ 'config_drift' in incident_types_list }}"
        simulate_capacity: "{{ 'capacity_issue' in incident_types_list }}"

    # --- service_down: stop ops-monitor service ---
    - name: Stop ops-monitor service to simulate infrastructure incident
      ansible.builtin.systemd:
        name: ops-monitor
        state: stopped
      when: simulate_service_down
      ignore_errors: true

    - name: Log service failure to syslog
      ansible.builtin.shell: |
        logger -t ops-monitor -p daemon.err "ops-monitor[$(systemctl show ops-monitor -p MainPID --value)]: CRITICAL - service stopped unexpectedly"
        logger -t systemd -p daemon.err "ops-monitor.service: Main process exited, code=killed"
      when: simulate_service_down
      changed_when: true
      ignore_errors: true

    # --- config_drift: modify sshd_config ---
    - name: Backup sshd_config before drift simulation
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.bak
        remote_src: true
      when: simulate_config_drift

    - name: Introduce SSH configuration drift (MaxAuthTries violation)
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?MaxAuthTries'
        line: 'MaxAuthTries 10'
        state: present
      when: simulate_config_drift

    - name: Log compliance violation
      ansible.builtin.shell: |
        logger -t sshd -p auth.warn "sshd_config drift detected: MaxAuthTries=10 violates CIS policy (max 4)"
      when: simulate_config_drift
      changed_when: true
      ignore_errors: true

    # --- capacity_issue: fill disk ---
    - name: Fill disk with large log file to simulate capacity issue
      ansible.builtin.shell: |
        fallocate -l 7G /var/log/capacity_test.log 2>/dev/null || \
          dd if=/dev/zero bs=1M count=7168 of=/var/log/capacity_test.log 2>/dev/null
        echo "Capacity issue simulated: 7GB log file created"
      when: simulate_capacity
      changed_when: true

    # --- unknown: fill tmpfs (AI scenario) ---
    - name: Fill app session storage to cause 500 errors
      ansible.builtin.shell: |
        umount /var/log/app-sessions 2>/dev/null || true
        mount -t tmpfs -o size=1m tmpfs /var/log/app-sessions
        dd if=/dev/zero of=/var/log/app-sessions/filler.bin bs=1K 2>/dev/null || true
        echo "Simulated: app session storage full - app returning 500 errors"
      when: simulate_unknown
      changed_when: true

    - name: Write application error messages to syslog
      ansible.builtin.shell: |
        for i in {1..50}; do
          logger -t nginx -p local0.err "write() to '/var/log/nginx/error.log' failed (28: No space left on device)"
          logger -t app -p local0.err "CRITICAL: Failed to write session data - disk full on /var/log partition"
        done
        logger -t kernel -p kern.err "EXT4-fs error: no space left on device"
      when: simulate_unknown
      changed_when: true

    - name: Report simulation complete
      ansible.builtin.debug:
        msg: "Issue planted: disk pressure + application errors written to syslog on {{ inventory_hostname }}"
      when: simulate_unknown

# Play 2: Fire AO webhooks
- name: Simulate - Fire AO Webhooks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    incident_types_list: "{{ incident_types if incident_types is iterable and incident_types is not string else [incident_types] }}"
    target_host: "{{ target_host | default('cert-demo-vm') }}"
    severity: "{{ severity | default('2-High') }}"
    ao_instance: "{{ ao_instance | default('primary') }}"
    ao_base_url: "{{ lookup('env', 'AO2_BASE_URL') if ao_instance == 'secondary' else lookup('env', 'AO_BASE_URL') | default('http://54.159.25.87:8080') }}"
    ao_sa_client_id: "{{ lookup('env', 'AO2_CLIENT_ID') if ao_instance == 'secondary' else lookup('env', 'AO_CLIENT_ID') }}"
    ao_sa_client_secret: "{{ lookup('env', 'AO2_CLIENT_SECRET') if ao_instance == 'secondary' else lookup('env', 'AO_CLIENT_SECRET') }}"
    incident_descriptions:
      service_down: "ops-monitor infrastructure service stopped unexpectedly on {{ target_host }}. Monitoring pipeline affected. Alerting and health checks may be missing."
      config_drift: "SSH configuration drift detected on {{ target_host }}. MaxAuthTries set to 10, violating CIS RHEL 9 benchmark (policy max: 4). Compliance scanner flagged."
      capacity_issue: "Disk utilization on {{ target_host }} at critical threshold. Large log files consuming root filesystem. Write operations at risk."
      unclassified: "API Gateway showing intermittent 500 errors. Response times elevated. Users reporting failures. No obvious root cause identified by on-call team."
    # SCN4 routes: service_down, config_drift, capacity_issue
    # SCN5 routes: unclassified
    scn4_types: ['service_down', 'config_drift', 'capacity_issue']
    snow_instance_url: "{{ lookup('env', 'SNOW_INSTANCE_URL') | default('https://ansible.service-now.com') }}"
    snow_username: "{{ lookup('env', 'SNOW_USERNAME') }}"
    snow_password: "{{ lookup('env', 'SNOW_PASSWORD') }}"
    snow_caller_id: "0163e3d5871202505d60da083cbb3538"
    snow_category_map:
      service_down: "infrastructure"
      config_drift: "security"
      capacity_issue: "infrastructure"
      unclassified: "software"
    snow_urgency_map:
      "1-Critical": "1"
      "2-High": "2"
      "3-Medium": "3"
      "4-Low": "4"

  tasks:
    - name: Create SNOW ticket for each incident type
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/incident"
        method: POST
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Content-Type: "application/json"
          Accept: "application/json"
        body_format: json
        body:
          short_description: "{{ item | replace('_', ' ') | title }} detected on {{ target_host }}"
          description: "{{ incident_descriptions[item] | default('Incident detected.') }}"
          caller_id: "{{ snow_caller_id }}"
          category: "{{ snow_category_map[item] | default('software') }}"
          urgency: "{{ snow_urgency_map[severity] | default('2') }}"
          impact: "{{ snow_urgency_map[severity] | default('2') }}"
          state: "1"
        status_code: [200, 201]
      loop: "{{ incident_types_list }}"
      loop_control:
        loop_var: item
        extended: true
      register: snow_tickets

    - name: Build ticket ID map
      ansible.builtin.set_fact:
        ticket_map: "{{ ticket_map | default({}) | combine({result.item: result.json.result.number}) }}"
      loop: "{{ snow_tickets.results }}"
      loop_control:
        loop_var: result

    - name: Show created tickets
      ansible.builtin.debug:
        msg: "Created SNOW tickets: {{ ticket_map }}"

    - name: Get AO service account token
      ansible.builtin.uri:
        url: "{{ ao_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ ao_sa_client_id }}"
          client_secret: "{{ ao_sa_client_secret }}"
        status_code: [200, 201]
      register: ao_token_resp

    - name: Set AO token
      ansible.builtin.set_fact:
        ao_token: "{{ ao_token_resp.json.access_token }}"

    - name: Fire webhook for each incident type
      ansible.builtin.uri:
        url: "{{ ao_base_url }}/api/v1/webhooks/{{ 'snow-incident-scn5' if item == 'unclassified' else 'snow-incident-scn4' }}"
        method: POST
        headers:
          Authorization: "Bearer {{ ao_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          ticket_id: "{{ ticket_map[item] | default('INC' + (9000 + ansible_loop.index * 11) | string) }}"
          incident_type: "{{ item }}"
          host: "{{ target_host }}"
          description: "{{ incident_descriptions[item] | default('Incident simulated for demo.') }}"
          severity: "{{ severity }}"
        status_code: [200, 201, 202]
        validate_certs: false
      loop: "{{ incident_types_list }}"
      loop_control:
        loop_var: item
        extended: true
      register: webhook_results

    - name: Summary
      ansible.builtin.debug:
        msg: |
          ============================================================
          INCIDENTS SIMULATED
          ============================================================
          {% for result in webhook_results.results %}
          [{{ result.item | upper }}]
            Ticket:   INC{{ 9000 + (loop.index * 11) }}
            Workflow: {{ 'SCN5 (AI path)' if result.item == 'unclassified' else 'SCN4 (Deterministic)' }}
            Status:   {{ 'FIRED' if result.status in [200,201,202] else 'FAILED' }}
            {% if result.item == 'unclassified' %}
            Note: Disk pressure + error logs planted on {{ target_host }}
            {% endif %}
          {% endfor %}
          ============================================================
